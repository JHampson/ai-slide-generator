# Databricks App runtime configuration
# This file is read by the Databricks Apps runtime to configure the app execution

command:
  - sh
  - -c
  - pip install -r requirements.txt && PYTHONPATH=. python scripts/app_startup.py

env:
  - name: ENVIRONMENT
    value: production
  - name: DATABRICKS_HOST
    valueFrom: "system.databricks_host"  # Injected by Databricks
  - name: LOG_LEVEL
    value: INFO
  - name: MLFLOW_TRACKING_URI
    value: databricks
  # PGHOST and PGUSER are auto-injected by Databricks Apps from the attached database resource
  # OAuth token authentication is handled automatically via WorkspaceClient
  - name: LAKEBASE_SCHEMA
    value: app_data
