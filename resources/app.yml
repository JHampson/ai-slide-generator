resources:
  apps:
    tellr:
      name: tellr-${bundle.target}
      description: Tellr - AI Slide Generator
      source_code_path: ..

      # Attach the database resource to the app with read/write access
      resources:
        - name: app_database
          description: Lakebase PostgreSQL database for app state
          database:
            # Reference the database instance from the bundle resource
            instance_name: ${resources.database_instances.tellr_db.name}
            database_name: databricks_postgres
            # CAN_CONNECT_AND_CREATE grants full read/write access:
            # - Connect to database
            # - Read data (SELECT)
            # - Write data (INSERT, UPDATE, DELETE)
            # - Create/modify schema objects (CREATE TABLE, etc.)
            permission: CAN_CONNECT_AND_CREATE

      permissions:
        - user_name: ${workspace.current_user.userName}
          level: CAN_MANAGE

      user_api_scopes:
        # Existing scopes
        - sql
        - dashboards.genie
        - catalog.tables:read
        - serving.serving-endpoints
        # Vector Search (direct SDK)
        - vectorsearch.vector-search-endpoints
        - vectorsearch.vector-search-indexes
        # MCP (UC functions and external servers)
        - mcp.functions
        - mcp.external
